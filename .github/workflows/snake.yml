name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate twice a day so the animation always matches today's contributions
  workflow_dispatch:          # lets you trigger a rebuild manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: true

jobs:
  generate:
    name: Build contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation (light, dark, GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#58a6ff&color_background=#0d1117

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
