name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generate both SVG (dark/light) and an animated GIF
      - name: Generate snake animation assets
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Customize the snake's colour and the contribution grid colours
          # The 5 colours correspond to: empty, level1, level2, level3, level4
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#9B59B6&color_dots=#1A1B27,#4B2C5E,#7D3C98,#A569BD,#D2B4DE&snake_speed=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploy to the output branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
