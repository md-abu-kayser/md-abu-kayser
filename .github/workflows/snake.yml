name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # Refresh daily at 00:00 UTC.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

# Needed to commit the generated SVG files to the output branch.
permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  build:
    name: Build contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0969da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
